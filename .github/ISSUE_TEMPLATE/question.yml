name: Question / Support
description: Ask a question about how to use Astra Engine
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please use this template for general questions or support requests.
  - type: textarea
    id: question
    attributes:
      label: What is your question?
      description: Describe what you are trying to achieve or what you need help with.
      placeholder: How do I handle X event?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Code Snippet / Context
      description: Provide any relevant code snippets or context.
      render: python
