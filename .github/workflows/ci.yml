name: Audit & Build

run-name: ${{ github.actor }} is auditing Astra Engine 🚀

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-check:
    name: Code Quality & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install Dependencies
      description: Installs build tools and project dependencies (including dev tools).
      run: |
        python -m pip install --upgrade pip
        pip install build twine ruff mypy
        pip install -e .[dev]
        
    - name: Lint with Ruff
      description: Runs static analysis to find bugs and syntax errors.
      run: |
        # Enforce syntax checking and critical errors
        ruff check . --select=E9,F63,F7,F82 --target-version=py39
        # Run standard linting (warnings only for now to not block build)
        ruff check . --exit-zero
        
    - name: Static Type Check (Mypy)
      description: Verifies type hints across the 'astra' package.
      run: |
        mypy astra
        
    - name: Build Wheel & Sdist
      description: Builds the distribution files and checks them for PyPI validity.
      run: |
        python -m build
        twine check dist/*
